services:
  postgres:
    image: postgres:16
    container_name: beecraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beecraft
    ports:
      - "5432:5432"
    volumes:
      - beecraft_postgres:/var/lib/postgresql/data

volumes:
  beecraft_postgres:
  