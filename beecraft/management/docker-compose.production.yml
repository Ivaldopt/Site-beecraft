services:
  api:
    environment:
      CORS_ORIGINS: ${PUBLIC_SITE_URL:?define PUBLIC_SITE_URL}
      ENVIRONMENT: production
      STORE_API_URL: http://host.docker.internal:3000
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: /adm/
        VITE_API_URL: /adm-api
        VITE_STORE_URL: /
    ports: []
    expose: ["80"]
    restart: unless-stopped
  db:
    ports: []
    restart: unless-stopped
