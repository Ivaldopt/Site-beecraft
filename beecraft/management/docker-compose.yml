services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beecraft_management
      POSTGRES_USER: beecraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [management_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beecraft -d beecraft_management"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://beecraft:${POSTGRES_PASSWORD:-change-me}@db:5432/beecraft_management
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY}
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:8080
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-owner@beecraft.pt}
      BOOTSTRAP_OWNER_PASSWORD: ${BOOTSTRAP_OWNER_PASSWORD:?define BOOTSTRAP_OWNER_PASSWORD}
      STORE_API_URL: ${STORE_API_URL:-http://host.docker.internal:3000}
      STORE_ADMIN_KEY: ${STORE_ADMIN_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: /adm/
        VITE_API_URL: http://localhost:8000/api
        VITE_STORE_URL: http://localhost:5173
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  management_db:
